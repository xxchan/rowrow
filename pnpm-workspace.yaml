# Install scripts are off unless listed. These come with oar's pi runtime and are not needed
# (esbuild runs from its per-platform package without its postinstall check). Electron's
# downloads its binary: `pnpm desktop` and the desktop build fetch it when they need it, so
# `pnpm install` for the server and the web app stays small.
allowBuilds:
  "@google/genai": false
  electron: false
  electron-winstaller: false # electron-builder's Windows installer; rowrow builds for macOS only
  esbuild: false
  protobufjs: false
minimumReleaseAgeExclude:
  - "@oxfmt/binding-android-arm-eabi@0.71.0"
  - "@oxfmt/binding-android-arm64@0.71.0"
  - "@oxfmt/binding-darwin-arm64@0.71.0"
  - "@oxfmt/binding-darwin-x64@0.71.0"
  - "@oxfmt/binding-freebsd-x64@0.71.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.71.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.71.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.71.0"
  - "@oxfmt/binding-linux-arm64-musl@0.71.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.71.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.71.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.71.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.71.0"
  - "@oxfmt/binding-linux-x64-gnu@0.71.0"
  - "@oxfmt/binding-linux-x64-musl@0.71.0"
  - "@oxfmt/binding-openharmony-arm64@0.71.0"
  - "@oxfmt/binding-win32-arm64-msvc@0.71.0"
  - "@oxfmt/binding-win32-ia32-msvc@0.71.0"
  - "@oxfmt/binding-win32-x64-msvc@0.71.0"
  - "@oxlint/binding-android-arm-eabi@1.86.0"
  - "@oxlint/binding-android-arm64@1.86.0"
  - "@oxlint/binding-darwin-arm64@1.86.0"
  - "@oxlint/binding-darwin-x64@1.86.0"
  - "@oxlint/binding-freebsd-x64@1.86.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.86.0"
  - "@oxlint/binding-linux-arm64-gnu@1.86.0"
  - "@oxlint/binding-linux-arm64-musl@1.86.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.86.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.86.0"
  - "@oxlint/binding-linux-riscv64-musl@1.86.0"
  - "@oxlint/binding-linux-s390x-gnu@1.86.0"
  - "@oxlint/binding-linux-x64-gnu@1.86.0"
  - "@oxlint/binding-linux-x64-musl@1.86.0"
  - "@oxlint/binding-openharmony-arm64@1.86.0"
  - "@oxlint/binding-win32-ia32-msvc@1.86.0"
  - "@oxlint/binding-win32-x64-msvc@1.86.0"
  - hono@4.13.10
  - oxfmt@0.71.0
  - oxlint@1.86.0
  - "@botiverse/oar@0.20.0"
  - electron@44.5.0
  - "@earendil-works/chord@1.0.0"
  - "@earendil-works/pi-agent-core@1.0.0"
  - "@earendil-works/pi-ai@1.0.0"
  - "@earendil-works/pi-codemode@1.0.0"
  - "@earendil-works/pi-coding-agent@1.0.0"
  - "@earendil-works/pi-mcp@1.0.0"
  - "@earendil-works/pi-telemetry@1.0.0"
  - "@earendil-works/pi-tui@1.0.0"
overrides:
  # electron-builder 26.15 asks for ^3.0.0 but uses ElectronDownloadCacheMode, new in 3.1.0.
  "@electron/get@^3": ^3.1.0
  # @pierre/diffs takes either; 4.x would bring a second shiki core next to @streamdown/code's 3.x.
  "@shikijs/transformers": ^3.23.0
